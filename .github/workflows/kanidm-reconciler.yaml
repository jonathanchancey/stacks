---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Kanidm Reconciler

on:
  pull_request:
    branches: [main]
    paths:
      - flux/bastille/apps/auth-system/kanidm-client-reconciler/**
      - flux/bastille/apps/storage/kopia/app/**
      - tools/tests/**
      - tools/scripts/install-kanidm-reconciler-token.py
      - .github/workflows/kanidm-reconciler.yaml

permissions:
  contents: read

jobs:
  test:
    name: Kanidm Reconciler
    runs-on: ubuntu-latest
    container: docker.io/library/python:3.14.7-slim-bookworm@sha256:9ab8d9c8514b44f90cf0029dd42fdd7e9e211e639c8b995304cc04568dee900f
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Test reconciliation and credential handling
        run: python3 -W error -m unittest discover -s tools/tests -v
