---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: ci comment

# this trigger only publishes a link from api metadata; it never runs pull request code.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [ci]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions: {}

jobs:
  comment:
    name: publish diff link
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # locate the completed run's diff artifact
      contents: read
      pull-requests: write # update the current pull request's sticky diff link
    steps:
      # no checkout or artifact contents enter this privileged job.
      - name: publish rendered diff link
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            const repo = context.repo;
            const marker = '<!-- stacks-flux-diff -->';
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...repo, run_id: run.id, per_page: 100,
            });
            const artifact = artifacts.find(item => item.name === 'flux-diff' && !item.expired);
            if (!artifact) return;
            const pulls = await github.paginate(github.rest.pulls.list, {
              ...repo, state: 'open', base: 'main',
              head: `${run.head_repository.owner.login}:${run.head_branch}`, per_page: 100,
            });
            for (const candidate of pulls) {
              const { data: pull } = await github.rest.pulls.get({ ...repo, pull_number: candidate.number });
              if (pull.state !== 'open' || pull.head.sha !== run.head_sha ||
                  pull.head.repo?.full_name !== run.head_repository.full_name ||
                  pull.base.ref !== 'main' || pull.base.repo.full_name !== `${repo.owner}/${repo.repo}`) continue;
              const url = `${context.serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${run.id}/artifacts/${artifact.id}`;
              const body = `${marker}\nrendered flux diff for \`${run.head_sha.slice(0, 12)}\`: [download the full diff and changed images](${url}).\n\nall selected ci checks passed.`;
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...repo, issue_number: pull.number, per_page: 100,
              });
              const previous = comments.find(item => item.user?.login === 'github-actions[bot]' && item.body?.startsWith(marker));
              if (previous) {
                await github.rest.issues.updateComment({ ...repo, comment_id: previous.id, body });
              } else {
                await github.rest.issues.createComment({ ...repo, issue_number: pull.number, body });
              }
            }
