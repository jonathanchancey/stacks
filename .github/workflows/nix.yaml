---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Nix"

on:
  pull_request:
    branches: ["main"]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "tools/nix/**"
      - "taskfile.yaml"
      - "tools/taskfiles/**"
      - ".agents/**"
      - ".github/workflows/flux-diff.yaml"
      - ".github/workflows/nix.yaml"
  push:
    branches: ["main"]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "tools/nix/**"
      - "taskfile.yaml"
      - "tools/taskfiles/**"
      - ".agents/**"
      - ".github/workflows/flux-diff.yaml"
      - ".github/workflows/nix.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Nix (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: aarch64-darwin
            runner: macos-15
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: x86_64-linux
            runner: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3

      - name: Check flake
        run: nix flake check --no-update-lock-file --print-build-logs
