---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

set: [pipefail]
shopt: [globstar]

tasks:
  diff-ks:
    desc: diff flux kustomizations
    cmd: 'tools/scripts/flate.sh diff ks --path "{{.KUBERNETES_DIR}}" {{.CLI_ARGS}}'

  diff-hr:
    desc: diff flux helmreleases
    cmd: 'tools/scripts/flate.sh diff hr --path "{{.KUBERNETES_DIR}}" {{.CLI_ARGS}}'

  test-all:
    desc: test all flux kustomizations, helmreleases, and sources
    cmd: 'tools/scripts/flate-test.sh "{{.KUBERNETES_DIR}}"'

  test:
    desc: test flux resources in the current namespace or NAMESPACE
    cmd: 'tools/scripts/flate-test.sh "{{.KUBERNETES_DIR}}" "{{.NAMESPACE}}"'
    vars:
      NAMESPACE: "{{.NAMESPACE | default .CURRENT_NAMESPACE}}"
    preconditions:
      - sh: test -n "{{.NAMESPACE}}"
        msg: set NAMESPACE or select a kubectl namespace

  test-ns:
    desc: test flux resources in the working directory namespace or NAMESPACE
    cmd: 'tools/scripts/flate-test.sh "{{.KUBERNETES_DIR}}" "{{.NAMESPACE}}"'
    vars:
      NAMESPACE: "{{.NAMESPACE | default .CWD_NAMESPACE}}"
    preconditions:
      - sh: test -n "{{.NAMESPACE}}"
        msg: run from an apps namespace directory or set NAMESPACE

  ks-*:
    desc: Apply a Flux KS [PATH=required]
    cmd: >
      flux build --namespace flux-system ks {{base .PATH}}
      --kustomization-file {{.KUBERNETES_DIR}}/{{.PATH}}/ks.yaml
      --path {{.KUBERNETES_DIR}}/{{.PATH}}{{if contains .KUSTOMIZATION "not found"}} --dry-run{{end}}
      | yq 'with(select(.apiVersion == "kustomize.toolkit.fluxcd.io/v1" and .kind == "Kustomization"); .metadata.namespace = "flux-system")' -
      | kubectl {{.OPERATION}} {{if eq .OPERATION "apply"}}--server-side  --field-manager=kustomize-controller{{end}} --filename -
    requires:
      vars: [PATH]
    vars:
      OPERATION: "{{index .MATCH 0}}"
      KUSTOMIZATION:
        sh: flux --namespace flux-system get kustomizations {{base .PATH}}
    preconditions:
      - test -f {{.KUBERNETES_DIR}}/{{.PATH}}/ks.yaml

  cleanse:
    desc: Delete pods with a Failed/Pending/Succeeded phase
    cmds:
      - for:
          matrix:
            PHASE: [Failed, Pending, Succeeded]
        cmd: kubectl delete pods --all-namespaces --field-selector status.phase={{.ITEM.PHASE}} --ignore-not-found=true
