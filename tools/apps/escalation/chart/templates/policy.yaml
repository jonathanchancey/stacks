{{- if .Values.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-grants
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [serviceaccounts]
      - apiGroups: [rbac.authorization.k8s.io]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [rolebindings, clusterrolebindings]
  matchConditions:
    - name: server-identity
      expression: request.userInfo.username == {{ printf "system:serviceaccount:%s:%s" .Release.Namespace .Release.Name | toJson }}
  variables:
    - name: target
      expression: "request.operation == 'DELETE' ? oldObject : object"
  validations:
    - expression: >-
        (has(variables.target.metadata.labels) &&
        'escalation.stacks.dev/request' in variables.target.metadata.labels &&
        variables.target.metadata.labels['escalation.stacks.dev/request'].matches('^[0-9a-f-]{36}$') &&
        variables.target.metadata.name == 'grant-' + variables.target.metadata.labels['escalation.stacks.dev/request'])
      message: grant objects require deterministic names and request ownership labels
    - expression: >-
        request.resource.resource != 'serviceaccounts' ||
        (request.namespace == {{ .Values.config.grantNamespace | toJson }} &&
        has(variables.target.automountServiceAccountToken) && !variables.target.automountServiceAccountToken)
      message: grant service accounts must disable token automount in the grant namespace
    - expression: >-
        request.resource.resource == 'serviceaccounts' ||
        (has(variables.target.subjects) && size(variables.target.subjects) == 1 &&
        variables.target.subjects[0].kind == 'ServiceAccount' &&
        variables.target.subjects[0].namespace == {{ .Values.config.grantNamespace | toJson }} &&
        variables.target.subjects[0].name == variables.target.metadata.name &&
        variables.target.roleRef.apiGroup == 'rbac.authorization.k8s.io' && (
        false
{{- range .Values.config.profiles }}
        || (variables.target.roleRef.kind == {{ .role.kind | toJson }} &&
        variables.target.roleRef.name == {{ .role.name | toJson }} &&
        ((request.resource.resource == 'rolebindings' && request.namespace in {{ toJson .namespaces }})
{{- if and .cluster $.Values.clusterGrants }}
        || request.resource.resource == 'clusterrolebindings'
{{- end }}
        ))
{{- end }}
        ))
      message: bindings must use a single matching grant subject and an allowlisted profile role and scope
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-tokens
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [serviceaccounts/token]
  matchConditions:
    - name: server-identity
      expression: request.userInfo.username == {{ printf "system:serviceaccount:%s:%s" .Release.Namespace .Release.Name | toJson }}
  validations:
    - expression: >-
        (request.namespace == {{ .Values.config.grantNamespace | toJson }} &&
        request.name.matches('^grant-[0-9a-f-]{36}$') &&
        object.spec.audiences == [{{ .Values.config.audience | toJson }}] &&
        (!has(object.spec.boundObjectRef) || object.spec.boundObjectRef == null) && has(object.spec.expirationSeconds) &&
        object.spec.expirationSeconds >= 600 && (false
{{- range .Values.config.profiles }}
        || object.spec.expirationSeconds <= duration({{ .maxDuration | toJson }}).getSeconds()
{{- end }}
        ))
      message: token requests must target grant accounts with the configured audience and bounded lifetime
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-tokens
spec:
  policyName: {{ .Release.Namespace }}-{{ .Release.Name }}-tokens
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-grants
spec:
  policyName: {{ .Release.Namespace }}-{{ .Release.Name }}-grants
  validationActions: [Deny]
{{- end }}
