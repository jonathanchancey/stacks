enabled: false
image:
  repository: escalation
  tag: local
  pullPolicy: IfNotPresent
existingSecret: ""
clusterGrants: false
config:
  baseURL: https://escalation.example.org
  requesters:
    - url: https://workloads.example.org
      audience: escalation
  approverLogin:
    url: https://login.example.org
    clientID: escalation
    clientSecretFile: /run/oidc/client-secret
  issuedCredentials:
    audience: https://kubernetes.default.svc
    server: https://kubernetes.default.svc
  profiles:
    - name: observe-v1
      role:
        kind: Role
        name: escalation-observe
      namespaces: [default]
      requesterIssuers: [https://workloads.example.org]
      approverGroups: [approvers]
      maxDuration: 30m
      pendingDuration: 15m
