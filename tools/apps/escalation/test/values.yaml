clusterGrants: true
config:
  profiles:
    - name: observe-v1
      role:
        kind: Role
        name: escalation-observe
      namespaces: [default]
      requesterIssuers: [https://workloads.example.org]
      approverGroups: [operators]
      maxDuration: 30m
      pendingDuration: 15m
    - name: cluster-observe-v1
      role:
        kind: ClusterRole
        name: escalation-observe
      cluster: true
      requesterIssuers: [https://workloads.example.org]
      approverGroups: [operators]
      maxDuration: 30m
      pendingDuration: 15m
