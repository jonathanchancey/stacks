cluster:
  allowSchedulingOnControlPlanes: true
  apiServer:
    extraArgs:
      feature-gates: MutatingAdmissionPolicy=true
      runtime-config: admissionregistration.k8s.io/v1alpha1=true
      authentication-config: /var/lib/kubernetes/amp-authentication.yaml
    extraVolumes:
      - hostPath: /var/lib/kubernetes/amp-authentication.yaml
        mountPath: /var/lib/kubernetes/amp-authentication.yaml
        readonly: true
  network:
    cni:
      name: none
    podSubnets:
      - 10.244.0.0/16
    serviceSubnets:
      - 10.96.0.0/12
  proxy:
    disabled: true
machine:
  nodeLabels:
    topology.kubernetes.io/region: bastille
  install:
    diskSelector:
      model: "TEAM TM8FP6256G"
    extraKernelArgs:
      - i915.enable_guc=3
      - intel_iommu=on
      - iommu=pt
      - mitigations=off
      - net.ifnames=0
      - -selinux # Less security, faster puter
      - apparmor=0 # Less security, faster puter
      - init_on_alloc=0 # Less security, faster puter
      - init_on_free=0 # Less security, faster puter
      - security=none # Less security, faster puter
      - talos.auditd.disabled=1 # Less security, faster puter
  kernel:
    modules:
      - name: nbd
      - name: thunderbolt
      - name: thunderbolt_net
  udev:
    rules:
      - # Intel GPU
        SUBSYSTEM=="drm", KERNEL=="renderD*", GROUP="44", MODE="0660"
      - # Thunderbolt
        ACTION=="add", SUBSYSTEM=="thunderbolt", ATTR{authorized}=="0", ATTR{authorized}="1"
  files:
    - path: /etc/cri/conf.d/20-customization.part
      op: create
      content: |
        [plugins."io.containerd.cri.v1.images"]
          discard_unpacked_layers = false
    - path: /var/lib/kubernetes/amp-authentication.yaml
      permissions: 420
      op: create
      content: |
        apiVersion: apiserver.config.k8s.io/v1beta1
        kind: AuthenticationConfiguration
        jwt:
          - issuer:
              url: https://ampcode.com/api/workload-identity
              audiences:
                - https://kube-bastille.chancey.dev
              audienceMatchPolicy: MatchAny
            claimValidationRules:
              - expression: "claims.project_id == 'e75b009b-c969-40a8-abfd-bf0eb70b3d7b'"
                message: only the amp stacks project
              - expression: "claims.token_use == 'exchanged'"
                message: only exchanged amp workload identity tokens
            claimMappings:
              username:
                expression: "'amp:' + claims.thread_id"
              groups:
                expression: "['amp:stacks']"
              uid:
                expression: "claims.sub"
