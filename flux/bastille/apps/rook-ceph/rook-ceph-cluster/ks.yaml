---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app rook-ceph-cluster
  namespace: &namespace rook-ceph
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: rook-ceph-operator
      namespace: *namespace
  components:
    - ../../../../components/gatus
  interval: 1h
  # healthChecks:
  #   - apiVersion: helm.toolkit.fluxcd.io/v2
  #     kind: HelmRelease
  #     name: rook-ceph-cluster
  #     namespace: *namespace
  #   - apiVersion: ceph.rook.io/v1
  #     kind: CephCluster
  #     name: rook-ceph
  #     namespace: *namespace
  # healthCheckExprs:
  #   - apiVersion: ceph.rook.io/v1
  #     kind: CephCluster
  #     failed: status.ceph.health == 'HEALTH_ERR'
  #     current: status.ceph.health in ['HEALTH_OK', 'HEALTH_WARN']
  path: ./flux/bastille/apps/rook-ceph/rook-ceph-cluster/app
  postBuild:
    substitute:
      APP: *app
      GATUS_SUBDOMAIN: ceph
      GATUS_DOMAIN: bastille.chancey.dev
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 15m
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rook-ceph-cluster-dashboards
  namespace: rook-ceph
spec:
  targetNamespace: rook-ceph
  dependsOn:
    - name: grafana-dashboards
      namespace: observability
    - name: rook-ceph-cluster
      namespace: rook-ceph
  path: ./flux/bastille/apps/rook-ceph/rook-ceph-cluster/dashboards
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 5m
