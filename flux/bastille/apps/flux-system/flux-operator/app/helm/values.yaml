---
extraEnvs:
  - name: SSL_CERT_FILE
    value: /etc/ssl/certs/ca-certificates.crt
  - name: SSL_CERT_DIR
    value: /etc/ssl/certs
extraVolumes:
  - name: public-ca
    configMap:
      name: public-ca-bundle-20261020
extraVolumeMounts:
  - name: public-ca
    mountPath: /etc/ssl/certs
    readOnly: true
serviceMonitor:
  create: true
web:
  enabled: true
  config:
    baseURL: https://flux.chancey.dev
  httpRoute:
    enabled: true
    annotations:
      external-dns.alpha.kubernetes.io/hostname: flux.chancey.dev
    parentRefs:
      - name: edge
        kind: Gateway
        namespace: network
        sectionName: https
    hostnames:
      - flux.chancey.dev
  networkPolicy:
    create: false
