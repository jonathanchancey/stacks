---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: flux-cluster
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  uid: eM7_f4V7z
  resyncPeriod: 10m
  grafanaCom:
    id: 16714
    revision: 1
  variables:
    - name: DS_PROMETHEUS
      value: prometheus
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: prometheus
  folder: General
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: flux-control-plane
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  uid: flux-control-plane-cluster
  resyncPeriod: 10m
  grafanaCom:
    id: 21149
    revision: 1
  variables:
    - name: DS_PROMETHEUS
      value: prometheus
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: prometheus
  folder: General
