---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tofu-controller
spec:
  chartRef:
    kind: OCIRepository
    name: tofu-controller
  interval: 1h
  values:
    # Terraform objects in app namespaces reference the flux-system GitRepository
    allowCrossNamespaceRefs: true
    awsPackage:
      install: false
    runner:
      serviceAccount:
        # runner pods run in the Terraform object's namespace
        allowedNamespaces:
          - network
