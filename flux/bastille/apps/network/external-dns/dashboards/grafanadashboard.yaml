apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: external-dns
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  uid: eea5u_I7z
  resyncPeriod: 10m
  grafanaCom:
    id: 15038
    revision: 3
  variables:
    - name: datasource
      value: prometheus
  folder: General
