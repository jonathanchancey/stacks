---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/infra.contrib.fluxcd.io/terraform_v1alpha2.json
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: cloudflare
spec:
  interval: 1h
  approvePlan: auto
  runnerPodTemplate:
    spec:
      env:
        - name: SSL_CERT_FILE
          value: /etc/ssl/certs/ca-certificates.crt
        - name: SSL_CERT_DIR
          value: /etc/ssl/certs
      volumes:
        - name: public-ca
          configMap:
            name: public-ca-bundle-20261020
      volumeMounts:
        - name: public-ca
          mountPath: /etc/ssl/certs
          readOnly: true
  path: ./flux/bastille/apps/network/cloudflare/terraform
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  backendConfig:
    disable: true
  backendConfigsFrom:
    - kind: Secret
      name: cloudflare-secret
      keys:
        - bucket
        - access_key
        - secret_key
  varsFrom:
    - kind: Secret
      name: cloudflare-secret
      varsKeys:
        - cloudflare_api_token
        - cloudflare_account_id
        - state_passphrase
  writeOutputsToSecret:
    name: cloudflare-amp-stacks
    outputs:
      - amp_stacks_client_id:TUNNEL_SERVICE_TOKEN_ID
      - amp_stacks_client_secret:TUNNEL_SERVICE_TOKEN_SECRET
