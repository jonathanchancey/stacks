---
ingress:
  - hostname: kube-bastille.chancey.dev
    service: tcp://kubernetes.default.svc.cluster.local:443
  - hostname: "*.chancey.dev"
    service: https://envoy-external.network.svc.cluster.local
    originRequest:
      http2Origin: true
      originServerName: external.chancey.dev
  - service: http_status:404
