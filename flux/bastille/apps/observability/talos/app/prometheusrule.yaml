---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: talos
spec:
  groups:
    - name: talos
      rules:
        - alert: TalosLogDeliveryErrors
          expr: |
            sum by (node) (increase(vector_component_errors_total{namespace="observability",pod=~"talos-.+",component_id="loki"}[5m])) > 0
            or
            sum by (node) (increase(vector_component_discarded_events_total{namespace="observability",pod=~"talos-.+",intentional="false"}[5m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: talos log delivery errors on {{ $labels.node }}
            description: check the talos pod and loki ingestion errors before the node-local buffer fills.
        - alert: TalosLogBufferAlmostFull
          expr: |
            sum by (node) (vector_buffer_size_bytes{namespace="observability",pod=~"talos-.+",component_id="loki"})
            /
            sum by (node) (vector_buffer_max_size_bytes{namespace="observability",pod=~"talos-.+",component_id="loki"}) > 0.8
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: talos log buffer almost full on {{ $labels.node }}
            description: restore loki ingestion before forwarding blocks and talos loses logs.
