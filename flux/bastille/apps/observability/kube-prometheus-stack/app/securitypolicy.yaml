---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: prometheus-oidc
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: kube-prometheus-stack-prometheus
  oidc:
    provider:
      issuer: https://idm.chancey.dev/oauth2/openid/prometheus
    clientID: prometheus
    clientSecret:
      name: prometheus-oidc-client
    redirectURL: https://prometheus.chancey.dev/oauth2/callback
    logoutPath: /logout
    scopes:
      - openid
      - profile
      - email
