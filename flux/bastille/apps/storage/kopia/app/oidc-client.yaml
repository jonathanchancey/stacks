---
apiVersion: v1
kind: Secret
metadata:
  name: kopia-oidc-client
  annotations:
    identity.chancey.dev/client: storage/kopia-oidc-config
    kustomize.toolkit.fluxcd.io/prune: disabled
# Flux owns metadata; the reconciler owns the generated client-secret data key.
type: Opaque
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kopia-oidc-reconciler
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [kopia-oidc-config]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [kopia-oidc-client]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kopia-oidc-reconciler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kopia-oidc-reconciler
subjects:
  - kind: ServiceAccount
    name: kanidm-client-reconciler
    namespace: auth-system
