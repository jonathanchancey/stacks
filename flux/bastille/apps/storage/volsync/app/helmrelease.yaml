---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/helmrepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: volsync
  namespace: storage
spec:
  interval: 1h
  url: https://perfectra1n.github.io/volsync/charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: volsync
  namespace: storage
spec:
  chart:
    spec:
      chart: volsync
      version: 0.18.5
      sourceRef:
        kind: HelmRepository
        name: volsync
        namespace: storage
  interval: 30m
  timeout: 15m
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: monitoring.coreos.com
              version: v1
              kind: ServiceMonitor
              name: volsync
            patch: |-
              - op: add
                path: /spec/endpoints/0/bearerTokenFile
                value: /var/run/secrets/kubernetes.io/serviceaccount/token
  values:
    manageCRDs: true
    metrics:
      disableAuth: false
    image: &image
      repository: ghcr.io/perfectra1n/volsync
      tag: v0.17.11
    kopia: *image
    rclone: *image
    restic: *image
    rsync: *image
    rsync-tls: *image
    syncthing: *image
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
