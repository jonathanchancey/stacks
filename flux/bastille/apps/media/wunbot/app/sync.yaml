---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wunbot-secret-sync
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wunbot-secret-sync
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [wunbot-secret]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wunbot-secret-sync
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wunbot-secret-sync
subjects:
  - kind: ServiceAccount
    name: wunbot-secret-sync
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: wunbot-secret-sync
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      activeDeadlineSeconds: 120
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: wunbot-secret-sync
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sync
              image: mirror.gcr.io/library/python:3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
              command: [python3, -I, /script/sync.py]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - {name: script, mountPath: /script, readOnly: true}
                - {name: ca, mountPath: /openbao, readOnly: true}
                - {name: kube, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true}
                - {name: identity, mountPath: /identity, readOnly: true}
          volumes:
            - name: script
              configMap:
                name: wunbot-sync
            - name: ca
              configMap:
                name: openbao-ca
            - name: kube
              projected:
                sources:
                  - serviceAccountToken:
                      path: token
                      expirationSeconds: 600
                  - configMap:
                      name: kube-root-ca.crt
                      items:
                        - {key: ca.crt, path: ca.crt}
            - name: identity
              projected:
                sources:
                  - serviceAccountToken:
                      path: token
                      audience: openbao
                      expirationSeconds: 600
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: wunbot-secret-sync
spec:
  groups:
    - name: wunbot.sync
      rules:
        - alert: WunbotSecretSyncStale
          expr: |
            time() - kube_cronjob_status_last_successful_time{namespace="media",cronjob="wunbot-secret-sync"} > 1800
            or (
              (time() - kube_cronjob_created{namespace="media",cronjob="wunbot-secret-sync"} > 1800)
              unless on (namespace, cronjob)
                kube_cronjob_status_last_successful_time{namespace="media",cronjob="wunbot-secret-sync"}
            )
            or absent(kube_cronjob_info{namespace="media",cronjob="wunbot-secret-sync"})
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: wunbot token sync is overdue
            description: inspect the latest wunbot-secret-sync job and its openbao login.
