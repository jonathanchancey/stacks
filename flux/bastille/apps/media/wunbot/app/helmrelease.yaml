---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wunbot
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      main:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: forge.chancey.dev/coruscar/wunbot
              tag: v0.1.0@sha256:5b33cce514d4b641fd078ba2e981b4d2df2fce7246269d90f3ae9956679300f1
            envFrom:
              - secretRef:
                  name: wunbot-secret
