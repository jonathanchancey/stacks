---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: albedo
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 5.0.1
  url: oci://ghcr.io/bjw-s-labs/helm/app-template
  verify:
    provider: cosign
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: albedo
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: albedo
  values:
    controllers:
      main:
        replicas: 1
        strategy: Recreate
        serviceAccount:
          identifier: albedo
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/jonathanchancey/albedo
              tag: a65e5babc2b9-1
            env:
              TZ: America/Los_Angeles
              ALBEDO_KERNEL_BUDGET_MB: "512"
              SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
              SSL_CERT_DIR: /etc/ssl/certs
              REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: [/bin/albedo-healthcheck]
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 60
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: [/bin/albedo-healthcheck]
                  periodSeconds: 15
                  timeoutSeconds: 5
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: [/bin/albedo-healthcheck]
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      automountServiceAccountToken: true
      nodeSelector:
        kubernetes.io/arch: amd64
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    serviceAccount:
      albedo: {}
    persistence:
      public-ca:
        type: configMap
        name: public-ca-bundle-20261020
        globalMounts:
          - path: /etc/ssl/certs
            readOnly: true
      home:
        existingClaim: albedo
        globalMounts:
          - path: /home/albedo
      tmp:
        type: emptyDir
