---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: albedo
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 5.0.1
  url: oci://ghcr.io/bjw-s-labs/helm/app-template
  verify:
    provider: cosign
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: albedo
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: albedo
  values:
    controllers:
      main:
        replicas: 1
        strategy: Recreate
        serviceAccount:
          identifier: albedo
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/jonathanchancey/albedo
              tag: a65e5babc2b9-1@sha256:43c84aeefe68179ec2aa3ec8b0bd8d3c1580e974b57e08119c489f8d053ab41a
            env:
              TZ: America/Los_Angeles
              ALBEDO_KERNEL_BUDGET_MB: "512"
              SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
              SSL_CERT_DIR: /etc/ssl/certs
              REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
            envFrom:
              - secretRef:
                  name: albedo-secrets
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: [/bin/albedo-healthcheck]
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 60
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: [/bin/albedo-healthcheck]
                  periodSeconds: 15
                  timeoutSeconds: 5
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: [/bin/albedo-healthcheck]
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
          web:
            image:
              repository: docker.io/library/nginx
              tag: 1.31.8-alpine@sha256:785835ea65db4bba6f021acc0f3be91b0fef76a53fe41f8588c6698d2aed0606
            command: [/bin/sh, /config/start-web.sh]
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8080
                    httpHeaders:
                      - name: Host
                        value: albedo.chancey.dev
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8080
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
    defaultPodOptions:
      automountServiceAccountToken: true
      nodeSelector:
        kubernetes.io/arch: amd64
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    serviceAccount:
      albedo: {}
    service:
      app:
        controller: main
        ports:
          http:
            port: 8080
    route:
      app:
        hostnames: [albedo.chancey.dev]
        parentRefs:
          - name: edge
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: http
            timeouts:
              request: 0s
              backendRequest: 0s
    persistence:
      secrets:
        type: secret
        name: albedo-secrets
        advancedMounts:
          main:
            app:
              - path: /var/run/secrets/albedo
                readOnly: true
      public-ca:
        type: configMap
        name: public-ca-bundle-20261020
        globalMounts:
          - path: /etc/ssl/certs
            readOnly: true
      home:
        existingClaim: albedo
        advancedMounts:
          main:
            app:
              - path: /home/albedo
            web:
              - path: /albedo-home
                readOnly: true
      web-config:
        type: configMap
        name: albedo-web-config
        advancedMounts:
          main:
            web:
              - path: /config
                readOnly: true
      web-runtime:
        type: emptyDir
        medium: Memory
        advancedMounts:
          main:
            web:
              - path: /run/albedo-web
      tmp:
        type: emptyDir
