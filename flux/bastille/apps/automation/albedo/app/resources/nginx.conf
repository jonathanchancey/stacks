worker_processes 1;
pid /run/albedo-web/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    access_log off;
    client_max_body_size 64m;
    client_body_temp_path /run/albedo-web/body;
    proxy_temp_path /run/albedo-web/proxy;
    fastcgi_temp_path /run/albedo-web/fastcgi;
    uwsgi_temp_path /run/albedo-web/uwsgi;
    scgi_temp_path /run/albedo-web/scgi;

    map "$request_method:$http_origin" $api_origin_allowed {
        default 0;
        ~^(GET|HEAD):$ 1;
        ~^[A-Z]+:https://albedo\.chancey\.dev$ 1;
    }

    server {
        listen 8080 default_server;
        server_name _;
        return 421;
    }

    server {
        listen 8080;
        server_name albedo.chancey.dev;

        location ~ ^/api(?:/|$) {
            if ($api_origin_allowed = 0) { return 403; }
            include /run/albedo-web/upstream.conf;
            proxy_set_header Origin http://127.0.0.1:4317;
        }

        location / {
            include /run/albedo-web/upstream.conf;
        }
    }
}
