---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.config.k8s.io/kustomization_v1beta1.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./secrets.sops.yaml
  - ./pvc.yaml
  - ./rbac.yaml
  - ./networkpolicy.yaml
configMapGenerator:
  - name: albedo-web-config
    files:
      - nginx.conf=resources/nginx.conf
      - start-web.sh=resources/start-web.sh
    options:
      disableNameSuffixHash: true
      annotations:
        # leave shell expansions for the running container.
        kustomize.toolkit.fluxcd.io/substitute: disabled
