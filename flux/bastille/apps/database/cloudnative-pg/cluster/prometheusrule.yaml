---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cloudnative-pg
spec:
  groups:
    - name: cloudnative-pg.rules
      rules:
        - alert: LongRunningTransaction
          expr: |-
            cnpg_backends_max_tx_duration_seconds > 300
          for: 5m
          annotations:
            summary: >-
              Pod {{ $labels.pod }} is taking more than {{ $value }} seconds for a query.
          labels:
            severity: critical

        - alert: BackendsWaiting
          expr: |-
            cnpg_backends_waiting_total > 300
          for: 5m
          annotations:
            summary: >-
              Pod {{ $labels.pod }} has been waiting for longer than {{ $value }} seconds
          labels:
            severity: critical

        - alert: PGDatabase
          expr: |-
            cnpg_pg_database_xid_age > 300000000
          for: 5m
          annotations:
            summary: >-
              Over {{ $value }} transactions from frozen xid on pod {{ $labels.pod }}
          labels:
            severity: critical

        - alert: PGReplication
          expr: |-
            cnpg_pg_replication_lag > 300
          for: 5m
          annotations:
            summary: >-
              Standby is lagging behind by over {{ $value }} seconds
          labels:
            severity: critical

        - alert: LastFailedArchiveTime
          expr: |-
            (cnpg_pg_stat_archiver_last_failed_time - cnpg_pg_stat_archiver_last_archived_time) > 1
          for: 5m
          annotations:
            summary: >-
              Archiving failed for {{ $labels.pod }}
          labels:
            severity: critical

        - alert: DatabaseDeadlockConflicts
          expr: |-
            cnpg_pg_stat_database_deadlocks > 10
          for: 5m
          annotations:
            summary: >-
              There are over {{ $value }} deadlock conflicts in {{ $labels.pod }}
          labels:
            severity: critical

        - alert: ReplicaFailingReplication
          expr: |-
            cnpg_pg_replication_in_recovery > cnpg_pg_replication_is_wal_receiver_up
          for: 5m
          annotations:
            summary: >-
              Replica {{ $labels.pod }} is failing to replicate
          labels:
            severity: critical

    - name: cloudnative-pg.barman-backups
      rules:
        # Only production sources are expected to archive; recovery drills are excluded.
        - record: cnpg:expected_backup_cluster
          expr: vector(1)
          labels:
            namespace: database
            cluster: bastille-pg
        - record: cnpg:expected_backup_cluster
          expr: vector(1)
          labels:
            namespace: database
            cluster: postgres
        - record: cnpg:expected_backup_cluster
          expr: vector(1)
          labels:
            namespace: database
            cluster: immich-postgres
        # Actual plugin metrics identify the cluster using job="database/<name>".
        # Aggregate replicas and expose that verified identity as a cluster label.
        - record: cnpg:barman_last_available_backup_timestamp
          expr: |-
            max by (namespace, cluster) (
              label_replace(
                barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{
                  namespace="database",job=~"database/(bastille-pg|postgres|immich-postgres)"
                },
                "cluster", "$1", "job", "database/(.*)"
              )
            )
        - record: cnpg:barman_last_failed_backup_timestamp
          expr: |-
            max by (namespace, cluster) (
              label_replace(
                barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp{
                  namespace="database",job=~"database/(bastille-pg|postgres|immich-postgres)"
                },
                "cluster", "$1", "job", "database/(.*)"
              )
            )
        - alert: CNPGBackupTimestampMissing
          expr: |-
            cnpg:expected_backup_cluster
            unless on (namespace, cluster)
            (cnpg:barman_last_available_backup_timestamp > 0)
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: '{{ $labels.namespace }}/{{ $labels.cluster }} has no valid B2 backup timestamp'
            description: The Barman plugin backup timestamp is missing or zero. Check source metrics, completed Backup resources, and the ObjectStore status schema. A healthy database does not establish backup health.
        - alert: CNPGBackupStale
          expr: |-
            (time() - cnpg:barman_last_available_backup_timestamp > 36 * 60 * 60)
            and
            (cnpg:barman_last_available_backup_timestamp > 0)
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: '{{ $labels.namespace }}/{{ $labels.cluster }} B2 base backup is overdue'
            description: The latest available base backup is more than 36 hours old. Check the daily ScheduledBackup, Barman plugin, and B2 access; WAL archiving alone is insufficient.
        - alert: CNPGBackupFailed
          expr: |-
            (cnpg:barman_last_failed_backup_timestamp > 0)
            and on (namespace, cluster)
            (
              cnpg:barman_last_failed_backup_timestamp
              > on (namespace, cluster)
              (
                cnpg:barman_last_available_backup_timestamp
                or cnpg:expected_backup_cluster * 0
              )
            )
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: '{{ $labels.namespace }}/{{ $labels.cluster }} B2 backup failed'
            description: The Barman plugin reports a backup failure newer than the latest successful backup. Inspect the Backup resource and plugin logs, then verify a newer backup completes.
