---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openbao-raft
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ceph-block
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: openbao
spec:
  selector:
    app.kubernetes.io/name: openbao
  ports:
    - name: https
      port: 8200
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbao
  annotations:
    secret.reloader.stakater.com/reload: openbao-listener,openbao-seal
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: openbao
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbao
    spec:
      serviceAccountName: openbao
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: ghcr.io/openbao/openbao
          command: [bao, server, -config=/config/server.hcl]
          env:
            - name: BAO_CACERT
              value: /tls/ca.crt
            - name: BAO_ADDR
              value: https://127.0.0.1:8200
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: https
              containerPort: 8200
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /v1/sys/health
              port: https
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: data, mountPath: /data}
            - {name: seal, mountPath: /seal, readOnly: true}
            - {name: tls, mountPath: /tls, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap:
            name: openbao-config
        - name: data
          persistentVolumeClaim:
            claimName: openbao-raft
        - name: seal
          secret:
            secretName: openbao-seal
            defaultMode: 0440
        - name: tls
          secret:
            secretName: openbao-listener
            defaultMode: 0440
        - name: tmp
          emptyDir: {}
