---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../components/openbao-ca
  - seal.sops.yaml
  - ca.sops.yaml
  - certificate.yaml
  - rbac.yaml
  - server.yaml
  - snapshot.yaml
configMapGenerator:
  - name: openbao-config
    files: [server.hcl]
images:
  - name: ghcr.io/openbao/openbao
    newTag: 2.7.3
    digest: sha256:ba4b133eb9586630024e71a617e66f37f29cc3534cdd46a6233e098ceded8dc9
patches:
  - target:
      kind: ReplicationSource
    patch: |-
      - op: add
        path: /spec/kopia/actions
        value:
          beforeSnapshot: 'test -s "$DATA_DIR/openbao.snap"'
