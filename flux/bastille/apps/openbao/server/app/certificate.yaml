---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: openbao-listener-ca
spec:
  ca:
    secretName: openbao-ca-keypair
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao
spec:
  secretName: openbao-listener
  issuerRef:
    name: openbao-listener-ca
    kind: Issuer
  dnsNames:
    - openbao.openbao.svc
  ipAddresses:
    - 127.0.0.1
