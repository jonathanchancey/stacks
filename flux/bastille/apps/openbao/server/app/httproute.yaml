---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openbao
  annotations:
    external-dns.alpha.kubernetes.io/hostname: &hostname openbao.chancey.dev
    gatus.home-operations.com/endpoint: |-
      path: /v1/sys/health
spec:
  hostnames:
    - *hostname
  parentRefs:
    - name: edge
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: openbao
          port: 8200
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/backendtlspolicy_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: openbao
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: openbao
  validation:
    hostname: openbao.openbao.svc
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: openbao-ca
