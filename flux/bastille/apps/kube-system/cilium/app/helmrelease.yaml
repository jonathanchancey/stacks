---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cilium
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 1.20.4
  url: oci://quay.io/cilium/charts/cilium
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: cilium
  dependsOn:
    - name: cert-manager
      namespace: cert-manager
  values:
    cluster:
      name: bastille

    bpf:
      hostLegacyRouting: false

    ipam:
      mode: kubernetes
    ipv4NativeRoutingCIDR: 10.244.0.0/16

    kubeProxyReplacement: true
    kubeProxyReplacementHealthzBindAddr: 0.0.0.0:10256

    loadBalancer:
      algorithm: maglev
      mode: snat

    localRedirectPolicy: true

    endpointRoutes:
      enabled: true

    cni-exclusive: false

    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE

    envoy:
      rollOutPods: true
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
          trustCRDsExist: true

    dashboards:
      enabled: true

    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        trustCRDsExist: true

    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup

    k8sServiceHost: localhost
    k8sServicePort: 7445

    bgpControlPlane:
      enabled: true

    hubble:
      tls:
        auto:
          method: certmanager
          certValidityDuration: 90
          certManagerIssuerRef:
            group: cert-manager.io
            kind: Issuer
            name: hubble-ca
      ui:
        enabled: true
      relay:
        enabled: true

    gatewayAPI:
      enabled: true
      enableAlpn: true
      enableAppProtocol: true
      gatewayClass:
        create: auto

    operator:
      dashboards:
        enabled: true
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
          trustCRDsExist: true
      podAnnotations:
        reloader.stakater.com/auto: "true"

    podAnnotations:
      reloader.stakater.com/auto: "true"
