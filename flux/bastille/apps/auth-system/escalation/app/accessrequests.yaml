---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/apiextensions.k8s.io/customresourcedefinition_v1.json
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: accessrequests.escalation.stacks.dev
spec:
  group: escalation.stacks.dev
  scope: Namespaced
  names:
    plural: accessrequests
    singular: accessrequest
    kind: AccessRequest
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [requester, profile, namespace, durationSeconds, reason, pendingUntil, roleUID, rules, scopeHash, idempotencyHash]
              properties:
                requester:
                  type: object
                  required: [issuer, subject]
                  properties:
                    issuer: {type: string, maxLength: 2048}
                    subject: {type: string, maxLength: 1024}
                    groups:
                      type: array
                      maxItems: 64
                      items: {type: string, maxLength: 256}
                profile:
                  type: object
                  required: [name, role, namespaces, cluster, requesterIssuers, approverGroups, maxDuration, pendingDuration]
                  properties:
                    name: {type: string, maxLength: 63}
                    role:
                      type: object
                      required: [kind, name]
                      properties:
                        kind: {type: string, enum: [Role, ClusterRole]}
                        name: {type: string, maxLength: 253}
                    namespaces:
                      type: array
                      nullable: true
                      maxItems: 64
                      items: {type: string, maxLength: 63}
                    cluster: {type: boolean}
                    requesterIssuers:
                      type: array
                      maxItems: 16
                      items: {type: string, maxLength: 2048}
                    requesterGroups:
                      type: array
                      maxItems: 64
                      items: {type: string, maxLength: 256}
                    approverGroups:
                      type: array
                      maxItems: 64
                      items: {type: string, maxLength: 256}
                    maxDuration: {type: string, maxLength: 32}
                    pendingDuration: {type: string, maxLength: 32}
                namespace: {type: string, maxLength: 63}
                durationSeconds: {type: integer, format: int64, minimum: 1, maximum: 86400}
                reason: {type: string, maxLength: 4096}
                pendingUntil: {type: string, format: date-time, maxLength: 64}
                roleUID: {type: string, maxLength: 128}
                rules:
                  type: array
                  nullable: true
                  maxItems: 64
                  items:
                    type: object
                    required: [verbs]
                    properties:
                      verbs:
                        type: array
                        maxItems: 32
                        items: {type: string, maxLength: 64}
                      apiGroups:
                        type: array
                        maxItems: 32
                        items: {type: string, maxLength: 253}
                      resources:
                        type: array
                        maxItems: 64
                        items: {type: string, maxLength: 253}
                      resourceNames:
                        type: array
                        maxItems: 64
                        items: {type: string, maxLength: 253}
                      nonResourceURLs:
                        type: array
                        maxItems: 32
                        items: {type: string, maxLength: 2048}
                scopeHash: {type: string, maxLength: 64}
                idempotencyHash: {type: string, maxLength: 64}
              x-kubernetes-validations:
                - rule: >-
                    self.requester == oldSelf.requester &&
                    self.profile.name == oldSelf.profile.name &&
                    self.profile.role == oldSelf.profile.role &&
                    has(self.profile.namespaces) == has(oldSelf.profile.namespaces) &&
                    (!has(self.profile.namespaces) || self.profile.namespaces == oldSelf.profile.namespaces) &&
                    self.profile.cluster == oldSelf.profile.cluster &&
                    self.profile.requesterIssuers == oldSelf.profile.requesterIssuers &&
                    has(self.profile.requesterGroups) == has(oldSelf.profile.requesterGroups) &&
                    (!has(self.profile.requesterGroups) || self.profile.requesterGroups == oldSelf.profile.requesterGroups) &&
                    self.profile.approverGroups == oldSelf.profile.approverGroups &&
                    self.profile.maxDuration == oldSelf.profile.maxDuration &&
                    self.profile.pendingDuration == oldSelf.profile.pendingDuration &&
                    self.__namespace__ == oldSelf.__namespace__ &&
                    self.durationSeconds == oldSelf.durationSeconds &&
                    self.reason == oldSelf.reason &&
                    self.pendingUntil == oldSelf.pendingUntil &&
                    self.roleUID == oldSelf.roleUID &&
                    has(self.rules) == has(oldSelf.rules) &&
                    (!has(self.rules) || self.rules == oldSelf.rules) &&
                    self.scopeHash == oldSelf.scopeHash &&
                    self.idempotencyHash == oldSelf.idempotencyHash
                  message: spec is immutable
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
