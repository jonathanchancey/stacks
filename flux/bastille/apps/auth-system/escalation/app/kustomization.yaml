---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.config.k8s.io/kustomization_v1beta1.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://raw.githubusercontent.com/jonathanchancey/escalation/69a315fef16411821be03bc2df1de5714d939cbb/chart/crds/accessrequests.yaml
  - ./namespace.yaml
  - ./helmrelease.yaml
  - ./configmap.yaml
  - ./rbac.yaml
  - ./policy.yaml
  - ./storage-observe.yaml
  - ./secrets.sops.yaml
patches:
  - target:
      kind: CustomResourceDefinition
      name: accessrequests.escalation.stacks.dev
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          kustomize.toolkit.fluxcd.io/prune: disabled
