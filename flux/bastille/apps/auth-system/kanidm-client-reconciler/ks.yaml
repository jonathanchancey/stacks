---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kanidm-client-reconciler
  namespace: auth-system
spec:
  targetNamespace: auth-system
  dependsOn:
    - name: kanidm
      namespace: auth-system
  interval: 5m
  retryInterval: 1m
  timeout: 2m
  path: ./flux/bastille/apps/auth-system/kanidm-client-reconciler/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
