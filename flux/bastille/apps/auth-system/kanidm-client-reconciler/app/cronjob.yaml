---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/batch/cronjob_v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kanidm-client-reconciler
spec:
  schedule: "*/5 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: kanidm-client-reconciler
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 240
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          serviceAccountName: kanidm-client-reconciler
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reconcile
              image: docker.io/library/python:3.14.7-slim-bookworm@sha256:9ab8d9c8514b44f90cf0029dd42fdd7e9e211e639c8b995304cc04568dee900f
              command: [python3, /script/reconcile.py]
              env:
                - name: KANIDM_URL
                  value: https://idm.chancey.dev
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: PYTHONUNBUFFERED
                  value: "1"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: script
                  mountPath: /script
                  readOnly: true
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: bootstrap
                  mountPath: /bootstrap
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: kanidm-client-reconciler-script
            - name: config
              configMap:
                name: kanidm-client-reconciler-config
            - name: bootstrap
              secret:
                secretName: kanidm-client-reconciler-token
                defaultMode: 0440
