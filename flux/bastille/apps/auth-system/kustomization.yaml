---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: auth-system
components:
  - ../../components/common
resources:
  - ./kanidm/ks.yaml
  - ./roles/ks.yaml
  - ./zitadel/ks.yaml
patches:
  - target:
      kind: Namespace
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: unused
        annotations:
          volsync.backube/privileged-movers: "true"
