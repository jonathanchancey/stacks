---
# amp orbs in the stacks project authenticate via amp workload identity (oidc);
# the apiserver AuthenticationConfiguration maps them to the amp:stacks group
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: amp-stacks-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: amp:stacks
